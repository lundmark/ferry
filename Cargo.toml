[package]
name = "zed-ftp"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
ignore = "0.4"

[dev-dependencies]
tempfile = "3"
